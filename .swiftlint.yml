# Lenient on purpose: only rules that catch real mistakes fail the build.
# Style rules stay off until the codebase is tidied for them.
included:
  - TeamRadio
  - TeamRadioWidgets
  - Shared
excluded:
  - build
  - DerivedData
  - TeamRadio/Resources
disabled_rules:
  - line_length
  - identifier_name
  - type_name
  - type_body_length
  - file_length
  - function_body_length
  - function_parameter_count
  - cyclomatic_complexity
  - trailing_whitespace
  - trailing_comma
  - vertical_whitespace
  - todo
  - large_tuple
  - nesting
  - multiple_closures_with_trailing_closure
  - opening_brace
  - statement_position
  - for_where
  - implicit_optional_initialization
  - orphaned_doc_comment
  - shorthand_operator
  - non_optional_string_data_conversion
force_cast: error
force_try: error
